events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/x-javascript;
    gzip_min_length 256;

    # Security headers applied globally
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Upstream agents ───────────────────────────────────────────────────
    upstream orchestrator  { server orchestrator:8000; }
    upstream dispatch      { server dispatch:8001; }
    upstream customer      { server customer:8002; }
    upstream drivers       { server drivers:8003; }
    upstream accounts      { server accounts:8004; }
    upstream compliance    { server compliance:8005; }
    upstream admin_api     { server admin:8006; }
    upstream dashboard     { server dashboard:80; }

    # ─── HTTP → HTTPS redirect ─────────────────────────────────────────────
    server {
        listen 80;
        server_name captain.taxi www.captain.taxi admin.captaintaxi.ca 82.29.178.157;
        location / { return 301 https://$host$request_uri; }
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
    }

    # ─── Public website: captain.taxi ─────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name captain.taxi www.captain.taxi;

        ssl_certificate     /etc/nginx/ssl/captain-taxi/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/captain-taxi/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # www → non-www canonical redirect
        if ($host = 'www.captain.taxi') {
            return 301 https://captain.taxi$request_uri;
        }

        root /var/www/captain-taxi;
        index index.html;

        # Cache static assets aggressively
        location ~* \.(css|js|svg|ico|woff2|woff|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # AI/SEO files served with correct content types
        location = /robots.txt  { add_header Content-Type text/plain; }
        location = /sitemap.xml { add_header Content-Type application/xml; }
        location = /llms.txt    { add_header Content-Type text/plain; }

        # Customer booking API (CORS-enabled for the public site)
        location /api/customer/ {
            proxy_pass http://customer/api/customer/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Access-Control-Allow-Origin "https://captain.taxi" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
        }

        # SPA fallback for any future client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ─── HTTPS main server ─────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name admin.captaintaxi.ca;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Owner dashboard (React SPA)
        location / {
            proxy_pass http://dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Agent API routes ──────────────────────────────────────────────
        location /api/dispatch/ {
            proxy_pass http://dispatch/api/dispatch/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        location /api/customer/ {
            proxy_pass http://customer/api/customer/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Dashboard API routes (served by admin:8006) ───────────────────
        location /api/dashboard/ {
            proxy_pass http://admin_api/api/dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/drivers/ {
            proxy_pass http://admin_api/api/drivers/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/escalations/ {
            proxy_pass http://admin_api/api/escalations/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/reports/ {
            proxy_pass http://admin_api/api/reports/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/announcements/ {
            proxy_pass http://admin_api/api/announcements/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/settings/ {
            proxy_pass http://admin_api/api/settings/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/hr/ {
            proxy_pass http://admin_api/api/hr/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/accounts/ {
            proxy_pass http://accounts/api/accounts/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/compliance/ {
            proxy_pass http://compliance/api/compliance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://orchestrator/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # ── WebSockets (live dispatch map) ────────────────────────────────
        location /ws/ {
            proxy_pass http://dispatch;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # ── External webhooks ─────────────────────────────────────────────
        location /webhooks/twilio/ {
            proxy_pass http://customer/webhooks/twilio/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /webhooks/vapi/ {
            proxy_pass http://customer/webhooks/vapi/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # QuickBooks OAuth callback
        location /api/accounts/qb/callback {
            proxy_pass http://accounts/api/accounts/qb/callback;
            proxy_set_header Host $host;
        }
    }
}
