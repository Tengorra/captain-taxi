# Nginx reverse proxy config for Captain Taxi Customer Service Agent
# Place at: /etc/nginx/sites-available/customer.captaintaxi.ca
# Enable: ln -s /etc/nginx/sites-available/customer.captaintaxi.ca /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name customer.captaintaxi.ca;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name customer.captaintaxi.ca;

    # SSL — managed by Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/customer.captaintaxi.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/customer.captaintaxi.ca/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains";

    # Logs
    access_log /var/log/nginx/customer.captaintaxi.ca-access.log;
    error_log  /var/log/nginx/customer.captaintaxi.ca-error.log;

    # Widget JS — cache it
    location = /chat/widget.js {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # WebSocket upgrade for live chat
    location /chat/ws/ {
        proxy_pass       http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else — standard proxy
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }
}
